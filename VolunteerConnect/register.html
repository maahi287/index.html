<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Volunteer Registration | VolunteerConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ============================= -->
    <!-- NAVIGATION BAR -->
    <!-- ============================= -->

    <header class="navbar">

        <div class="logo">
            🤝 VolunteerConnect
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="register.html">Register</a>

            <a href="tasks.html">Tasks</a>

            <a href="schedule.html">Schedule</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="admin.html">Admin</a>

        </nav>

    </header>



    <!-- ============================= -->
    <!-- REGISTRATION SECTION -->
    <!-- ============================= -->

    <section class="registration-section">

        <div class="registration-container">

            <h1>
                Volunteer Registration
            </h1>

            <p>
                Join VolunteerConnect and become part of
                meaningful NGO activities.
            </p>


            <!-- ============================= -->
            <!-- REGISTRATION FORM -->
            <!-- ============================= -->

            <form id="volunteerForm">


                <!-- NAME -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- EMAIL -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- PHONE -->

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >


                <!-- SKILLS -->

                <label for="skills">
                    Skills
                </label>

                <input
                    type="text"
                    id="skills"
                    placeholder="Example: Teaching, Computer, Event Management"
                    required
                >


                <!-- AVAILABILITY -->

                <label for="availability">
                    Availability
                </label>

                <select id="availability" required>

                    <option value="">
                        Select your availability
                    </option>

                    <option value="Weekdays">
                        Weekdays
                    </option>

                    <option value="Weekends">
                        Weekends
                    </option>

                    <option value="Both">
                        Weekdays and Weekends
                    </option>

                </select>


                <!-- INTEREST -->

                <label for="interest">
                    Area of Interest
                </label>

                <select id="interest" required>

                    <option value="">
                        Select an area
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Healthcare">
                        Healthcare
                    </option>

                    <option value="Environment">
                        Environment
                    </option>

                    <option value="Community Service">
                        Community Service
                    </option>

                    <option value="Animal Welfare">
                        Animal Welfare
                    </option>

                </select>


                <!-- SUBMIT BUTTON -->

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Register as Volunteer
                </button>


            </form>

        </div>

    </section>



    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="js/script.js"></script>


</body>

</html>
